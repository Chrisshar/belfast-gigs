<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo options</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f6f4ef; color: #1f1f1d; font: 400 14px/1.4 Jost, sans-serif; }
  .wrap { max-width: 75rem; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 18px; }
  .opt { background: #fff; border: 1px solid #e4e0d6; border-radius: 18px; overflow: hidden; }
  .bar { display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 24px; border-bottom: 1px solid #e4e0d6; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 1.15rem; letter-spacing: -.005em; }
  .brand svg { width: 30px; height: 30px; }
  .bar nav { display: flex; gap: 24px; font-weight: 500; font-size: .95rem; }
  .big { display: grid; grid-template-columns: 1fr 1fr 1fr; }
  .big > div { display: grid; place-items: center; padding: 32px; gap: 14px; }
  .big .lg { width: 140px; height: 140px; }
  .tile { background: #2f4a6d; }
  .ink { background: #1f1f1d; }
  .label { padding: 0 24px 18px; color: #6a6760; }
  .label b { color: #1f1f1d; font-weight: 500; }
  .stack { text-align: center; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; font-size: .78rem; }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script src="logo.js"></script>
<script>
const NOTES = {
  cranes: ["A · The cranes", "Samson and Goliath, the shipyard gantries, with a red sun or record between the legs. The only one that says Belfast."],
  record: ["B · The record", "A record with its red label set off-centre. Clean, but could belong to any music site."],
  monogram: ["C · The monogram", "B and G built from semicircles and an open circle, half the B in red. Most typographic."],
};
document.querySelector("#wrap").innerHTML = Object.keys(LOGO_MARKS).map((k) => `
  <section class="opt">
    <div class="bar"><div class="brand">${logoMark(k)}<span>Belfast Gigs</span></div><nav><span>Gigs</span><span>Regular nights</span></nav></div>
    <div class="big">
      <div>${logoMark(k)}<div class="stack">Belfast Gigs</div></div>
      <div class="tile">${logoMark(k, "#ece6da")}</div>
      <div class="ink">${logoMark(k, "#ece6da")}</div>
    </div>
    <p class="label"><b>${NOTES[k][0]}</b>: ${NOTES[k][1]}</p>
  </section>`).join("");
</script>
</body>
</html>
