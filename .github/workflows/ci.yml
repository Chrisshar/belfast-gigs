name: CI

# Checks every human push and pull request, including commits made through the CMS.
# (The scrape workflow builds the site itself before it pushes, and pushes made with the
# workflow token don't trigger other workflows.)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scraper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/pyproject.toml
      - run: pip install -e "./scraper[dev,llm]"
      - run: python -m pytest scraper/tests -q

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
