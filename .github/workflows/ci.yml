name: CI

# Checks every human push and pull request, including commits made through the CMS.
# (The scrape workflow builds the site itself before it pushes, and pushes made with the
# workflow token don't trigger other workflows.)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scraper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/pyproject.toml
      - run: pip install -e "./scraper[dev,llm]"
      - name: Tests
        run: |
          set -o pipefail
          # Failures also become annotations, so they show on the run page and in the API.
          python -m pytest scraper/tests -q -rfE --tb=line 2>&1 | tee "$RUNNER_TEMP/pytest.txt" || {
            grep -E "^(FAILED|ERROR) |^/.*:[0-9]+: " "$RUNNER_TEMP/pytest.txt" | head -n 20 | sed 's/^/::error::/'
            exit 1
          }

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test src/lib/*.test.ts
      - run: npm run build
